name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked tooling
        run: "pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.txt"
      # Branch naming is checked by pr-checks.yml; this hook would fail on pushes to develop/main.
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  # Known vulnerabilities in pinned dependencies (backend, and the repository's own tooling).
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked tooling
        run: "pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.txt"
      - name: Audit Python dependencies
        run: |
          for lock in backend/requirements.txt backend/requirements-dev.txt .github/requirements/ci.txt; do
            echo "== $lock"
            pip-audit --progress-spinner off --strict --disable-pip --require-hashes -r "$lock"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit repository tooling (npm)
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies (npm)
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm audit --audit-level=high --prefix frontend

  # Backend/frontend jobs only run once their folder exists, so CI is green from the first commit.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      compose: ${{ steps.check.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          echo "backend=$([ -f backend/manage.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint + tests)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@localhost:5432/desk
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-a-secret-value
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: "pip install --require-hashes --only-binary=:all: -r requirements-dev.txt"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django deployment checklist with production settings
        env:
          DJANGO_DEBUG: "false"
          HTTPS_ONLY: "true"
          DJANGO_ALLOWED_HOSTS: desk.example.com
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING
      - name: Validate the OpenAPI schema (no warnings allowed)
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      # The frontend's types are generated from a committed copy of the schema: an API change must update it
      # (docker compose exec -T api python manage.py spectacular --format openapi-json > frontend/src/api/openapi.json)
      - name: The frontend's copy of the API schema is current
        if: hashFiles('frontend/src/api/openapi.json') != ''
        run: |
          python manage.py spectacular --format openapi-json > /tmp/openapi.json
          diff -u ../frontend/src/api/openapi.json /tmp/openapi.json
      - name: Tests
        run: pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint + tests + build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: The API types match the committed schema
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  # Proves the one-command startup from a clean checkout.
  compose:
    name: Docker compose smoke test
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      # --wait above only returns once the api healthcheck (GET /health) passes.
      - name: Health endpoint reports ok
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8000/health)
          echo "$body"
          test "$body" = '{"status": "ok", "db": "ok"}'
      - name: The app is served, and proxies the API on the same origin
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:8080/requests/any-client-route | grep -q '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/auth/me/)" = 401
      - name: Entrypoint applied all migrations
        run: docker compose exec -T api python manage.py migrate --check
      - name: Seeded admin can log in and read their profile
        run: |
          login=$(curl --fail --silent --show-error --cookie-jar cookies.txt             -H "Content-Type: application/json"             -d '{"email": "admin@example.com", "password": "admin123"}'             http://localhost:8000/api/auth/login/)
          access=$(echo "$login" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access"])')
          grep -q refresh_token cookies.txt
          curl --fail --silent --show-error -H "Authorization: Bearer $access" http://localhost:8000/api/auth/me/             | grep -q '"role":"admin"'
      - name: The demo export was imported once, and importing it again creates nothing
        run: |
          out=$(docker compose exec -T api python manage.py import_episodes seed/episodes.csv --as admin@example.com)
          echo "$out"
          echo "$out" | grep -q " 0 created, 0 updated, 173 unchanged, 17 skipped"
      - name: Demo data was seeded, and seeding again changes nothing
        run: |
          out=$(docker compose exec -T api python manage.py seed)
          echo "$out"
          echo "$out" | grep -q "Users: 0 created, 5 already present"
          echo "$out" | grep -q "Robots: 0 created, 5 already present"
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Property-based fuzzing (docs/testing.md "Fuzzing"): thousands of generated requests, valid and invalid,
  # against the stack in production mode. Fails on any 500, any response the schema doesn't describe, and any
  # invalid input the API accepts.
  fuzz:
    name: API fuzzing (Schemathesis)
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "false"  # production error pages and settings, not the debug ones
      THROTTLE_ANON_RATE: 1000000/min  # the fuzzer is one fast client; rate limits have their own tests
      THROTTLE_USER_RATE: 1000000/hour
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Fuzz the API
        run: sh fuzz/run.sh
      - name: Upload the fuzzing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-report
          path: fuzz/report/
      - name: Show logs
        if: failure()
        run: docker compose logs api
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Real browser journeys against the whole stack, with an axe accessibility check of every screen they visit
  # (frontend/e2e). Fails on any broken journey or any serious WCAG 2.1 AA violation.
  e2e:
    name: End-to-end (Playwright)
    needs: detect
    if: needs.detect.outputs.frontend == 'true' && needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      THROTTLE_LOGIN_RATE: 1000/min  # one machine signs in many times a minute; the limit has its own tests
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the test tools
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run e2e:install  # the Playwright pinned in package-lock.json, not whatever npx would fetch
      - name: Run the journeys
        working-directory: frontend
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - name: Show logs
        if: failure()
        run: docker compose logs api web
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Static analysis and coverage of new code; the job fails if the SonarCloud quality gate fails.
  sonarcloud:
    name: SonarCloud
    needs: [detect, backend, frontend]
    if: needs.detect.outputs.backend == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate "new code" and blame
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v8
        if: needs.frontend.result == 'success'
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # Single stable check name for branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [hygiene, dependency-audit, detect, backend, frontend, compose, fuzz, e2e, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."
