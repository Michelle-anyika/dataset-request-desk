name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked tooling
        run: "pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.txt"
      # Branch naming is checked by pr-checks.yml; this hook would fail on pushes to develop/main.
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  # Backend/frontend jobs only run once their folder exists, so CI is green from the first commit.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      compose: ${{ steps.check.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          echo "backend=$([ -f backend/manage.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint + tests)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@localhost:5432/desk
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-a-secret-value
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: "pip install --require-hashes --only-binary=:all: -r requirements-dev.txt"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate the OpenAPI schema (no warnings allowed)
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Tests
        run: pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint + tests + build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  # Proves the one-command startup from a clean checkout.
  compose:
    name: Docker compose smoke test
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      # --wait above only returns once the api healthcheck (GET /health) passes.
      - name: Health endpoint reports ok
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8000/health)
          echo "$body"
          test "$body" = '{"status": "ok", "db": "ok"}'
      - name: Entrypoint applied all migrations
        run: docker compose exec -T api python manage.py migrate --check
      - name: Seeded admin can log in and read their profile
        run: |
          login=$(curl --fail --silent --show-error --cookie-jar cookies.txt             -H "Content-Type: application/json"             -d '{"email": "admin@example.com", "password": "admin123"}'             http://localhost:8000/api/auth/login/)
          access=$(echo "$login" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access"])')
          grep -q refresh_token cookies.txt
          curl --fail --silent --show-error -H "Authorization: Bearer $access" http://localhost:8000/api/auth/me/             | grep -q '"role":"admin"'
      - name: Demo data was seeded, and seeding again changes nothing
        run: |
          out=$(docker compose exec -T api python manage.py seed)
          echo "$out"
          echo "$out" | grep -q "Users: 0 created, 5 already present"
          echo "$out" | grep -q "Robots: 0 created, 5 already present"
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Single stable check name for branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [hygiene, detect, backend, frontend, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."
