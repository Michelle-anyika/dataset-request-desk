[tool.ruff]
line-length = 110
target-version = "py313"
# seed/ holds files supplied with the brief, kept exactly as given.
extend-exclude = ["*/migrations/*", "seed/*"]

[tool.ruff.lint]
# S = flake8-bandit security rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert, and tests use fixed passwords for throwaway accounts.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["real_password_hashing: use the production password hasher instead of the fast test one"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/migrations/*", "manage.py", "config/wsgi.py"]
branch = true  # an untested `else` counts as a gap, not only an untested line

[tool.coverage.report]
fail_under = 95  # CI fails below this; currently ~99.5% (docs/testing.md "Coverage")
show_missing = true
skip_covered = true
# Deliberately untested: display-only strings (admin and shell) and type-checking-only imports.
exclude_also = ["def __str__", "if TYPE_CHECKING:"]
