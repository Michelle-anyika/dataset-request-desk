# Render blueprint: the API in two environments (docs/deployment.md). Render builds backend/Dockerfile;
# migrations run in the container's entrypoint. Deploys are triggered by CI after every check passes
# (.github/workflows/deploy.yml), not by Render on each push: autoDeploy is off.
#
# Secrets marked `sync: false` are entered in the Render dashboard when the blueprint is created.
# DJANGO_SECRET_KEY and JWT_SIGNING_KEY are generated by Render: random, and different per environment.

services:
  - type: web
    name: desk-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon, branch "development" (direct connection, not pooled)
        sync: false
      - key: FRONTEND_URL # links in emails
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: HTTPS_ONLY
        value: "true"
      - key: TRUSTED_PROXY_COUNT # Vercel's proxy, then Render's
        value: "2"
      - key: SEED_DEMO_DATA # demo accounts with public passwords: dev only
        value: "true"
      - key: API_DOCS_ENABLED # Swagger UI: dev only
        value: "true"
      - key: SENTRY_ENVIRONMENT
        value: dev
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: desk-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon, branch "production" (direct connection, not pooled)
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: HTTPS_ONLY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: SEED_DEMO_DATA # never in production: the first admin is created once (docs/deployment.md)
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
