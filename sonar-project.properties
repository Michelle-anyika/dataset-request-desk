sonar.organization=michelle-anyika
sonar.projectKey=Michelle-anyika_dataset-request-desk
sonar.projectName=Dataset Request Desk

# Application code and the infrastructure that builds and ships it.
sonar.sources=backend/apps,backend/config,backend/docker,backend/Dockerfile,frontend/src,frontend/Dockerfile,.github/workflows
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=**/migrations/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
