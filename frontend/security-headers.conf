# Security headers for the app's own responses. Included in each location below: nginx drops server-level
# add_header lines in any location that sets its own, so they are repeated by include, not inherited.
# Mantine writes its theme variables into a <style> tag, hence 'unsafe-inline' for styles only; scripts are
# limited to this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
