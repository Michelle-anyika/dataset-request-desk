# One origin for the app and the API (PLAN.md decision #8): the browser talks only to this server, which
# serves the built app and proxies /api to Django. The refresh cookie stays first-party; no CORS needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 21m;  # the API accepts CSV uploads up to 20 MB

    # The API sets its own, stricter security headers (default-src 'none').
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # longer than gunicorn's 30 s timeout, so Django answers first
    }

    # Liveness of this container only; the API has its own /health.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve the app, never cached, so a deploy is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
